[project]
name = "inpnet"
version = "0.1.0"
description = "Interpersonal networks from open text (FH-SWF AKI NLP project)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "spacy>=3.8.16",
    "en-core-web-sm",
]

[project.scripts]
inpnet = "inpnet.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inpnet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: hits live Wikimedia APIs (deselect with -m 'not network')"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
