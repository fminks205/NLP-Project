[project]
name = "inpnet"
version = "0.1.0"
description = "Interpersonal networks from open text (FH-SWF AKI NLP project)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
]

[project.scripts]
inpnet = "inpnet.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inpnet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: hits live Wikimedia APIs (deselect with -m 'not network')"]
