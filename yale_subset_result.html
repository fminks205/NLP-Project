o or Slutsky, but to the great thermodynamicist, Willard Gibbs", "edge__Q153243__Q709432": "Samuelson later explained that in his understanding of prices his \"debts were not primarily to Pareto or Slutsky, but to the great thermodynamicist, Willard Gibbs of Yale.\"", "a_box__Q153243__Q709432__institution": "Institution: Yale", "a_box__Q153243__Q709432__action": "Action: were not primarily to Pareto or Slutsky, but to the great thermodynamicist, Willard Gibbs", "edge__Q153243__Q57125": "When the German physical chemist Walther Nernst visited Yale in 1906 to give the Silliman lecture, he was surprised to find no tangible memorial for Gibbs.", "a_box__Q153243__Q57125__institution": "Institution: Yale", "a_box__Q153243__Q57125__time": "Time: 1906", "a_box__Q153243__Q57125__place": "Place: Silliman", "a_box__Q153243__Q57125__action": "Action: chemist Walther Nernst visited Yale in 1906 to give the Silliman lecture, he was surprised to find no tangible memorial for Gibbs", "edge__Q107405__Q153243": "In 1945, Yale University created the J. Willard Gibbs Professorship in Theoretical Chemistry, held until 1973 by Lars Onsager.", "a_box__Q107405__Q153243__time": "Time: 1945", "a_box__Q107405__Q153243__institution": "Institution: Yale University", "a_box__Q107405__Q153243__action": "Action: Gibbs Professorship in Theoretical Chemistry, held until 1973 by Lars Onsager", "edge__Q153243__Q1700322": "The first day of issue ceremony for the series was held on May 4 at Yale University's Luce Hall and was attended by John Marburger, scientific advisor to the president of the United States, Rick Levin, president of Yale, and family members of the scientists honored, including physician John W. Gibbs, a distant cousin of Willard Gibbs.", "a_box__Q153243__Q1700322__time": "Time: The first day", "a_box__Q153243__Q1700322__institution": "Institution: Yale University's", "a_box__Q153243__Q1700322__place": "Place: the United States", "a_box__Q153243__Q1700322__action": "Action: Marburger, <script>
  (function () {
    const canvas = document.getElementById("viz-canvas");
    const svg = canvas.querySelector("svg");
    if (!svg) return;
    const MIN_SCALE = 0.1, MAX_SCALE = 8;
    const vb = svg.viewBox && svg.viewBox.baseVal;
    const svgW = (vb && vb.width) || svg.width.baseVal.value;
    const svgH = (vb && vb.height) || svg.height.baseVal.value;

    let scale = 1, tx = 0, ty = 0;
    function apply() {
      svg.style.transform = "translate(" + tx + "px, " + ty + "px) scale(" + scale + ")";
    }
    function fitToView() {
      const cw = canvas.clientWidth, ch = canvas.clientHeight;
      scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE,
        Math.min(cw / svgW, ch / svgH) * 0.92));
      tx = (cw - svgW * scale) / 2;
      ty = (ch - svgH * scale) / 2;
      apply();
    }
    fitToView();

    canvas.addEventListener("wheel", function (e) {
      e.preventDefault();
      const before = scale;
      const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
      scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale * factor));
      tx = e.clientX - ((e.clientX - tx) / before) * scale;
      ty = e.clientY - ((e.clientY - ty) / before) * scale;
      apply();
    }, { passive: false });

    let dragging = false, lastX = 0, lastY = 0;
    canvas.addEventListener("mousedown", function (e) {
      dragging = true; lastX = e.clientX; lastY = e.clientY;
      canvas.classList.add("dragging");
    });
    window.addEventListener("mousemove", function (e) {
      if (!dragging) return;
      tx += e.clientX - lastX; ty += e.clientY - lastY;
      lastX = e.clientX; lastY = e.clientY;
      apply();
    });
    window.addEventListener("mouseup", function () {
      dragging = false;
      canvas.classList.remove("dragging");
    });
    canvas.addEventListener("dblclick", fitToView);
    window.addEventListener("resize", fitToView);
  })();
</script>
